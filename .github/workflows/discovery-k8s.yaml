name: Discovery k8s

# Kind plus AKO takes 3-5 minutes, so L3 runs as its own job.
# The job needs the Enterprise feature key (FEATURES_CONF). Fork pull
# requests do not receive repository secrets, so the job is skipped and
# discovery-integration.yaml reports L3 as a skipped layer.
#
# The tests run on the runner. setup-kind-ako writes the endpoint hostname
# into the runner hosts file, aimed at the kind node.
#
# A schedule runs from the default branch. That run checks out stage.

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - stage
      - CLIENT-5732-dev-pluggable-discovery # TODO: remove post testing
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  l3:
    name: L3 discovery (k8s)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}
    timeout-minutes: 45
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'stage' || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Require the Enterprise feature key
        env:
          FEATURES_CONF: ${{ secrets.FEATURES_CONF }}
        run: |
          set -euo pipefail
          if [[ -z "${FEATURES_CONF}" ]]; then
            echo "::error::FEATURES_CONF is required to start the Enterprise cluster. L3 does not run on fork pull requests."
            exit 1
          fi

      - name: Setup kind and AKO
        id: kind-ako
        uses: aerospike/shared-workflows/.github/actions/setup-kind-ako@308f37e0cd5c7a6386a99ea7afc379d5a4ea9256 # v5.1.0
        with:
          features-content: ${{ secrets.FEATURES_CONF }}

      - name: Run K suite
        env:
          DISCOVERY_ENDPOINT_HOSTNAME: ${{ steps.kind-ako.outputs.endpoint-hostname }}
          DISCOVERY_INGRESS_PORTS: ${{ steps.kind-ako.outputs.ingress-ports }}
          DISCOVERY_SERVICE_NODE_PORTS: ${{ steps.kind-ako.outputs.service-node-ports }}
          DISCOVERY_KUBECONFIG: ${{ steps.kind-ako.outputs.kubeconfig }}
          AEROSPIKE_ADMIN_PASSWORD: ${{ steps.kind-ako.outputs.admin-password }}
        run: bash .github/discovery/run-l3-suite.sh
