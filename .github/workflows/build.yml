name: Aerospike Go Client Tests
on:
  pull_request:

permissions:
  contents: read  
  actions: read  

env:
  AEROSPIKE_HOSTS: "127.0.0.1:3000"
  GODEBUG: fips140=only
  GOFIPS140: latest

jobs:
  make-matrix:
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}
    outputs:
      input-matrix: ${{ steps.create-server-matrix.outputs.matrix }}
      go-version: ${{ steps.get-go-version.outputs.go-version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get Go version
        id: get-go-version
        run: |
          echo "go-version=$(grep '^go [0-9]' go.mod | awk '{print $2}')" >> $GITHUB_OUTPUT
          
      - id: create-server-matrix
        uses: ./.github/actions/make-matrix
        with:
          default_json: |
            {
              "7.1.0": { "version": "7.1.0" },
              "8.1.0.1": { "version": "8.1.0.1" },
              "8.1.1": { "version": "8.1.1" }
            }
          go_version: ${{ steps.get-go-version.outputs.go-version }}
          modes: AP

      - name: debug - print input variables
        run: |
          echo "Go version: ${{ steps.get-go-version.outputs.go-version }}"
          echo 'Matrix output:'
          echo '${{ steps.create-server-matrix.outputs.matrix }}' | jq .

  build:
    timeout-minutes: 30
    needs: make-matrix
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}
    permissions:
      actions: write 
    strategy:
      matrix:
        include: ${{ fromJson(needs.make-matrix.outputs.input-matrix) }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: "Setup Go ${{ matrix.go-version }}"
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "${{ matrix.go-version }}"
          cache: true
      - name: Fetch dependencies
        env:
          GODEBUG: fips140=on
        run: |
          # Install all dependencies
          go mod download

          # Install ginkgo CLI and gocovmerge for testing
          go install github.com/onsi/ginkgo/v2/ginkgo@v2.22.2
          go mod download github.com/wadey/gocovmerge

          # Vendor the dependencies
          go mod vendor
      - name: Display Go version
        run: |
          echo "Go version: ${{ matrix.go-version }}"
      - name: Set up Aerospike Database
        uses: reugn/github-action-aerospike@2065a9209cfd5ef88a3e07f3e7929e321d1e0067 # v1.1.0
        with:
          aerospike_version: ${{ matrix.version }}
          nodes: "1"
          mode: ${{ matrix.mode }}
          expose_ports: "3000:3000"
          feature_conf_encoded: ${{ secrets.FEATURES_CONF }}
      - name: Test Lua Code
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: go run -mod=vendor github.com/onsi/ginkgo/v2/ginkgo -cover -race -r -keep-going -succinct -randomize-suites internal/lua
      - name: Test types package
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: go run -mod=vendor github.com/onsi/ginkgo/v2/ginkgo -cover -race -r -keep-going -succinct -randomize-suites types
      - name: Test pkg tests
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: go run -mod=vendor github.com/onsi/ginkgo/v2/ginkgo -cover -race -r -keep-going -succinct -randomize-suites pkg
      - name: Build Benchmark tool
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: cd tools/benchmark | go build -mod=vendor -tags as_proxy -o benchmark .
      - name: Build asinfo tool
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: cd tools/asinfo | go build -mod=vendor -o asinfo .
      - name: Build cli tool
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: cd tools/cli | go build -mod=vendor -o cli .
      - name: Build example files
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: find examples -name "*.go" -type f -print0 | xargs -0 -n1 go build
      - name: Build with Reflection code removed
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: go run -mod=vendor github.com/onsi/ginkgo/v2/ginkgo build -tags="as_performance" .
      - name: Build for Google App Engine (unsafe package removed)
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: go run -mod=vendor github.com/onsi/ginkgo/v2/ginkgo build -tags="app_engine" .
      - name: Run the tests
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: go run -mod=vendor github.com/onsi/ginkgo/v2/ginkgo -output-dir=./ -coverprofile=covprofile_native.out -covermode=atomic -coverpkg=./... -race -keep-going -succinct -randomize-suites -skip="HyperLogLog"
      - name: Combine Cover Profiles
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: go run -mod=vendor github.com/wadey/gocovmerge covprofile_*.out > cover_all.out
      - name: Check Code Coverage
        id: check-coverage
        uses: vladopajic/go-test-coverage@f190f667e23b4441202d0bab0f8c2e7bce8925b6 # v2.18.4
        continue-on-error: true
        with:
          config: ./.testcoverage.yml
      - name: Show coverage report in step summary
        if: always()
        run: |
          {
            echo "**coverage:**"
            echo ""
            echo "**${{ matrix.version }}-${{ matrix.mode }}:** ${{ steps.check-coverage.outputs.total-coverage }}%"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: create and move cover file to reports directory
        run: |
          mkdir -p reports
          mv covprofile_*.out reports/

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cover_${{matrix.version}}_${{matrix.mode}}
          path: reports
          if-no-files-found: warn

  merged_coverage:
    name: Final Coverage
    needs: build
    uses: ./.github/workflows/merge-coverage.yml
    with:
      artifact_pattern: cover_*
      threshold: ${{ fromJSON(vars.COVERAGE_THRESHOLD) }}
    permissions:
      actions: write
      contents: read 