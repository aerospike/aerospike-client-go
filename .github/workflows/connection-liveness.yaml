name: Connection liveness probe

on:
  workflow_dispatch:
  push:
    paths:
      - connection_liveness*.go
      - .github/workflows/connection-liveness.yaml

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      AEROSPIKE_TEST_SKIP_SUITE_CLIENT: "1"
      CGO_ENABLED: "1"
      LIVENESS_TESTS: TestIdleConnectionIsNotReportedClosed|TestConnectionClosedByPeerIsDetected|TestUnreadBytesOnPlainConnectionCountAsClosed|TestTLSConnectionWithPendingRecordStaysOpenUntilReset|TestProbedConnection|TestCheckoutReturnsTheLiveConnection|TestLivenessProbeAllocations|TestAbandonedConnectionIsStillClosedByGarbageCollector|TestExecuteAtUsesNoRetryForDeadPooledConnections
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Probe tests
        shell: bash
        run: go test -count=1 -v -run "${LIVENESS_TESTS}" .

      - name: Probe tests under the race detector
        shell: bash
        run: go test -race -count=20 -run "${LIVENESS_TESTS}" .

      - name: Probe cost
        shell: bash
        run: |
          set -o pipefail
          go test -count=6 -run '^$' -bench 'BenchmarkLivenessProbe|BenchmarkCheckout|BenchmarkWriteCommand' -benchtime 2s . | tee probe-cost.txt
          {
            echo "### Probe cost on ${{ matrix.os }}"
            echo '```'
            grep -E '^(goos|goarch|cpu|Benchmark)' probe-cost.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The whole test suite against a single-node community server.
  # On Windows the server runs in WSL. Linux runs the same server as a control.
  suite:
    name: full suite on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      CGO_ENABLED: "1"
      AEROSPIKE_IMAGE: aerospike/aerospike-server:8.1.2.0
      GINKGO: go run github.com/onsi/ginkgo/v2/ginkgo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up WSL
        if: runner.os == 'Windows'
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2

      - name: Keep WSL running
        if: runner.os == 'Windows'
        shell: pwsh
        run: Start-Process -FilePath wsl.exe -ArgumentList '-d','Ubuntu-24.04','--','sleep','infinity' -WindowStyle Hidden

      - name: Start Aerospike in WSL
        if: runner.os == 'Windows'
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq docker.io >/dev/null
          docker_ready() { for _ in $(seq 1 20); do docker info >/dev/null 2>&1 && return 0; sleep 1; done; return 1; }
          service docker start || true
          if ! docker_ready; then
            update-alternatives --set iptables /usr/sbin/iptables-legacy
            update-alternatives --set ip6tables /usr/sbin/ip6tables-legacy
            service docker restart || true
            docker_ready || { cat /var/log/docker.log; exit 1; }
          fi
          docker run -d --name aerospike --network host ${{ env.AEROSPIKE_IMAGE }}

      - name: Find the server address from Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $address = ((wsl -d Ubuntu-24.04 -- hostname -I) -join ' ').Trim().Split(' ')[0]
          "AEROSPIKE_TEST_HOST=$address" >> $env:GITHUB_ENV
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            if ((Test-NetConnection $address -Port 3000 -WarningAction SilentlyContinue).TcpTestSucceeded) { Write-Host "server reachable at ${address}:3000"; exit 0 }
            Start-Sleep -Seconds 2
          }
          wsl -d Ubuntu-24.04 -- docker logs aerospike
          Write-Error "server not reachable at ${address}:3000"
          exit 1

      - name: Start Aerospike
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          docker run -d --name aerospike --network host "${AEROSPIKE_IMAGE}"
          echo "AEROSPIKE_TEST_HOST=127.0.0.1" >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/3000) 2>/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs aerospike
          exit 1

      - name: Wait for the server to settle
        shell: bash
        run: sleep 10

      - name: Lua
        if: ${{ !cancelled() }}
        shell: bash
        run: ${GINKGO} -race -r -keep-going -succinct internal/lua

      - name: Types
        if: ${{ !cancelled() }}
        shell: bash
        run: ${GINKGO} -race -r -keep-going -succinct types

      - name: Pkg
        if: ${{ !cancelled() }}
        shell: bash
        run: ${GINKGO} -race -r -keep-going -succinct pkg

      - name: Internal discovery packages
        if: ${{ !cancelled() }}
        shell: bash
        run: go test -race ./internal/discovery/...

      - name: Client suite
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          ${GINKGO} -race -keep-going -succinct -skip="HyperLogLog" . -- -h "${AEROSPIKE_TEST_HOST}" 2>&1 | tee client-suite.txt

      - name: Client suite summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo "### Client suite on ${{ matrix.os }}"
            echo '```'
            grep -E '^(Ran [0-9]+ of|SUCCESS!|FAIL!|PASS|FAIL|ok |--- FAIL|Ginkgo ran|Test Suite)' client-suite.txt | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
