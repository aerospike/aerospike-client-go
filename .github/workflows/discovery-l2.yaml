name: Discovery L2 run

on:
  workflow_call:
    inputs:
      subset:
        description: ce runs a community cluster without TLS, ee an enterprise cluster with TLS
        type: string
        required: true
      server-container-repo:
        description: Aerospike image repository path
        type: string
        required: true
      server-tag:
        description: Aerospike image tag
        type: string
        required: true
      tls-listen-port-base:
        description: First TLS proxy listen port. Empty skips TLS proxies.
        type: string
        required: false
        default: ""
      profile:
        description: >-
          A discovery-l2-topology profile: default, reachable, pass-through-names,
          pass-through-ports, port-map-range, cn-only, low-mtu, port-range,
          idle-reset or unresolved-access
        type: string
        required: false
        default: default
      unresolvable-hostnames:
        description: >-
          Map no advertised hostname in the servers on reachable and the pass-through profiles.
          Needs a server that does not resolve its access addresses.
        type: boolean
        required: false
        default: false
      verbatim-access-address:
        description: Whether the server advertises access-address hostnames verbatim, for unresolved-access
        type: boolean
        required: false
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  l2:
    name: cluster
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile L2 tests
        env:
          CGO_ENABLED: "0"
        run: go test -c -o l2.test .

      - name: Setup L2 topology
        id: l2
        uses: aerospike/aerospike-client-conformance/.github/actions/discovery-l2-topology@83959d02eb6bca719d71ba70e72648c528847b69 # main
        with:
          profile: ${{ inputs.profile }}
          subset: ${{ inputs.subset }}
          server-edition: ${{ inputs.subset == 'ee' && 'enterprise' || 'community' }}
          server-container-repo: ${{ inputs.server-container-repo }}
          server-tag: ${{ inputs.server-tag }}
          enable-tls: ${{ inputs.subset == 'ee' }}
          tls-listen-port-base: ${{ inputs.tls-listen-port-base }}
          features-content: ${{ inputs.subset == 'ee' && secrets.FEATURES_CONF || '' }}
          oidc-provider: ${{ vars.OIDC_PROVIDER }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE }}
          unresolvable-hostnames: ${{ inputs.unresolvable-hostnames }}
          verbatim-access-address: ${{ inputs.verbatim-access-address }}

      - name: Build DNS zone
        id: zone
        if: ${{ inputs.profile == 'default' }}
        env:
          CLIENT_NETWORK: ${{ steps.l2.outputs.client-network }}
          ENV_FILE: ${{ steps.l2.outputs.env-file }}
        run: |
          set -euo pipefail
          setting() { sed -n "s/^$1=//p" "${ENV_FILE}"; }
          host="$(setting DISCOVERY_ENDPOINT_HOSTNAME)"
          proxy_ip="$(docker inspect -f "{{(index .NetworkSettings.Networks \"${CLIENT_NETWORK}\").IPAddress}}" "$(setting TOXIPROXY_HOST)")"
          {
            echo "zone-name=${host}"
            echo "zone-content<<EOF"
            echo "\$ORIGIN ${host}."
            echo "@ 3600 IN SOA ns.${host}. admin.${host}. 1 60 60 60 1"
            echo "@ 1 IN A ${proxy_ip}"
            IFS=',' read -r -a ports <<< "$(setting DISCOVERY_ENDPOINT_PORTS)"
            for port in "${ports[@]}"; do
              echo "_aerospike._tcp 1 IN SRV 10 10 ${port} ${host}."
            done
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Setup DNS server
        id: dns
        if: ${{ inputs.profile == 'default' }}
        uses: aerospike/shared-workflows/.github/actions/setup-dns-server@308f37e0cd5c7a6386a99ea7afc379d5a4ea9256 # v5.1.0
        with:
          network-name: ${{ steps.l2.outputs.client-network }}
          zone-name: ${{ steps.zone.outputs.zone-name }}
          zone-content: ${{ steps.zone.outputs.zone-content }}

      - name: Run L2 discovery suite
        env:
          CLIENT_NETWORK: ${{ steps.l2.outputs.client-network }}
          ENV_FILE: ${{ steps.l2.outputs.env-file }}
          CLIENT_HOSTS: ${{ steps.l2.outputs.client-hosts }}
          TLS_CERT_DIR: ${{ steps.l2.outputs.tls-cert-dir }}
          TLS_LISTEN_PORT_BASE: ${{ inputs.tls-listen-port-base }}
          PROFILE: ${{ inputs.profile }}
          DISCOVERY_DNS_SERVER: ${{ steps.dns.outputs.server-address }}
        run: |
          set -euo pipefail
          require_setting() {
            grep -q "^$1=." "${ENV_FILE}" || { echo "::error::$2"; exit 1; }
          }
          # The default profile runs N-4 and N-11, which must fail here rather than skip.
          if [[ "${PROFILE}" == "default" ]]; then
            [[ -n "${DISCOVERY_DNS_SERVER}" ]] ||
              { echo "::error::the default profile has no DNS server for N-4"; exit 1; }
            require_setting DISCOVERY_CONTROL_DIR "the default profile has no node control for N-11"
          fi
          # unresolved-access tests skip unless these are set; fail here rather than go green.
          if [[ "${PROFILE}" == "unresolved-access" ]]; then
            require_setting DISCOVERY_UNRESOLVED_HOSTNAME "the unresolved-access profile has no DISCOVERY_UNRESOLVED_HOSTNAME"
            require_setting DISCOVERY_CONTROL_DIR "the unresolved-access profile has no node control"
          fi
          # A requested TLS listener that never appeared must fail here, not skip N-6.
          if [[ -n "${TLS_LISTEN_PORT_BASE}" ]]; then
            require_setting DISCOVERY_TLS_ENDPOINT_PORTS "tls-listen-port-base is set but the topology has no TLS listeners"
            [[ -n "${TLS_CERT_DIR}" ]] ||
              { echo "::error::tls-listen-port-base is set but the topology has no TLS certificate"; exit 1; }
          fi
          run_args=(
            --rm
            --network "${CLIENT_NETWORK}"
            --workdir "${GITHUB_WORKSPACE}"
            --env-file "${ENV_FILE}"
            -e AEROSPIKE_TEST_SKIP_SUITE_CLIENT=1
            -e DISCOVERY_DNS_SERVER
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}"
          )
          if [[ -n "${TLS_CERT_DIR}" ]]; then
            run_args+=(-v "${TLS_CERT_DIR}:/aerospike-tls:ro")
            run_args+=(-e "AEROSPIKE_CA_CERT=/aerospike-tls/ca.crt")
          fi
          if [[ -n "${CLIENT_HOSTS}" ]]; then
            IFS=',' read -r -a client_hosts <<< "${CLIENT_HOSTS}"
            for host in "${client_hosts[@]}"; do
              run_args+=(--add-host "${host}")
            done
          fi
          docker run "${run_args[@]}" debian:bookworm-slim bash .github/discovery/run-l2-suite.sh

      - name: Show the node server log
        if: ${{ always() && steps.l2.outputs.node-server-log != '' }}
        env:
          LOG_FILE: ${{ steps.l2.outputs.node-server-log }}
        run: cat "${LOG_FILE}"

      - name: Fix bind-mount ownership
        if: ${{ always() }}
        run: sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}"
