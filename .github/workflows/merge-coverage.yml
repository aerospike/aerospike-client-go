name: Merge Code Coverage
on:
  workflow_call:
    inputs:
      artifact_pattern:
        description: 'Artifact name pattern'
        required: false
        type: string
        default: 'cover_*'
      threshold:
        description: 'Coverage threshold'
        required: false
        type: number
        default: 0

permissions:
  actions: write
  contents: read  

jobs:
  merged_coverage:
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifact_pattern }}
          path: reports

      - name: Merge coverage profiles
        run: |
          go run github.com/wadey/gocovmerge reports/**/covprofile_*.out > cover_all.out

      - name: Check Code Coverage
        id: check-coverage
        uses: vladopajic/go-test-coverage@5f3508324fc185e82048a2861f8bdd3d83db133b # v2.18.9
        continue-on-error: true
        with:
          config: ./.testcoverage.yml
          threshold-total: ${{ inputs.threshold }}

      - name: Show coverage summary
        if: always()
        run: |
          {
            echo "**Total coverage:** ${{ steps.check-coverage.outputs.total-coverage }}%"
            echo
            echo "<details><summary><strong>Detailed report</strong></summary>"
            echo
            echo '```text'
            echo '${{ steps.check-coverage.outputs.report }}' | jq -r .
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Html report
        run: |
          mkdir -p coverage-reports
          go tool cover -html=cover_all.out -o coverage-reports/index.html
          mv cover_all.out coverage-reports/

      - name: Upload Html report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage-reports
          if-no-files-found: error