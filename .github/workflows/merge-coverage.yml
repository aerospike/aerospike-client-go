name: Merge Code Coverage
on:
  workflow_call:
    inputs:
      artifact_pattern:
        description: 'Artifact name pattern'
        required: false
        type: string
        default: 'cover_*'
      threshold:
        description: 'Coverage threshold'
        required: false
        type: number
        default: 0

permissions:
  actions: write
  contents: read  

jobs:
  merged_coverage:
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact_pattern }}
          path: reports

      - name: Merge coverage profiles
        run: |
          go run github.com/wadey/gocovmerge reports/**/covprofile_*.out > cover_all.out

      - name: Check Code Coverage
        id: check-coverage
        uses: vladopajic/go-test-coverage@239670d50ed072bfce8b9ab1765227a53429d664 # v2.20.1
        continue-on-error: true
        with:
          config: ./.testcoverage.yml
          threshold-total: ${{ inputs.threshold }}

      - name: Show coverage summary
        if: always()
        run: |
          {
            echo "**Total coverage:** ${{ steps.check-coverage.outputs.total-coverage }}%"
            echo
            echo "<details><summary><strong>Detailed report</strong></summary>"
            echo
            echo '```text'
            echo '${{ steps.check-coverage.outputs.report }}' | jq -r .
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Html report
        run: |
          mkdir -p coverage-reports
          go tool cover -html=cover_all.out -o coverage-reports/index.html
          mv cover_all.out coverage-reports/

      - name: Upload Html report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: coverage-reports
          if-no-files-found: error