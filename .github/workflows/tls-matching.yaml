name: TLS certificate matching

# Runs TestTLSEnvMatching over every case of the aerospike-client-conformance
# tls-matching test environment (envs/tls-matching.sh) and TestTLSEnvProxy
# against its two node proxy cluster. The fixture rows themselves are graded by
# TestConformance in discovery-conformance.yaml.

on:
  workflow_call:
    inputs:
      server-tag:
        description: Aerospike Enterprise image tag
        type: string
        required: true

permissions:
  contents: read

jobs:
  tls-matching:
    name: cases
    uses: aerospike/aerospike-client-conformance/.github/workflows/test-envs.yaml@ad070c54237112d8cbab2df0b40144a2df43e5fc # main
    with:
      environment: tls-matching
      conformance-ref: ad070c54237112d8cbab2df0b40144a2df43e5fc
      server-image: aerospike/aerospike-server-enterprise:${{ inputs.server-tag }}
      command: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(go mod edit -json | jq -r .Go)"
        : "${TLS_CASES:?}" "${PROXY_TLS_NAME:?}"
        CONFORMANCE_DIR="$PWD/.test-envs" AEROSPIKE_TEST_SKIP_SUITE_CLIENT=1 \
          go test -count=1 -v -timeout 30m -run '^(TestTLSEnvMatching|TestTLSEnvProxy)$' .
    secrets:
      features-conf: ${{ secrets.FEATURES_CONF }}
