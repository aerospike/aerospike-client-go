name: Nightly Tests

on:
  schedule:
    - cron: "0 2 * * *" # Nightly at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

env:
  AEROSPIKE_HOSTS: "127.0.0.1:3000"
  GODEBUG: fips140=only
  GOFIPS140: latest

jobs:
  make-matrix:
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}
    outputs:
      input-matrix: ${{ steps.create-server-matrix.outputs.matrix }}
      go-version: ${{ steps.get-go-version.outputs.go-version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Go version
        id: get-go-version
        run: |
          echo "go-version=$(grep '^go [0-9]' go.mod | awk '{print $2}')" >> $GITHUB_OUTPUT

      - id: create-server-matrix
        uses: ./.github/actions/make-matrix
        with:
          default_json: |
            {
              "latest-7": { "version": "7" },
              "8.1.1": { "version": "8.1.1" },
              "8.1.2-rc1": { "version": "8.1.2-rc1" }
            }
          go_version: ${{ steps.get-go-version.outputs.go-version }}
          modes: AP,SC

      - name: debug - print input variables
        run: |
          echo "Go version: ${{ steps.get-go-version.outputs.go-version }}"
          echo 'Matrix output:'
          echo '${{ steps.create-server-matrix.outputs.matrix }}' | jq .

  build:
    timeout-minutes: 30
    needs: make-matrix
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}
    permissions:
      id-token: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.make-matrix.outputs.input-matrix) }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup Go ${{ matrix.go-version }}"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ matrix.go-version }}"
          cache: true

      - name: Fetch dependencies
        env:
          GODEBUG: fips140=on
        run: |
          # Install all dependencies
          go mod download

          # Install ginkgo CLI and gocovmerge for testing
          go install github.com/onsi/ginkgo/v2/ginkgo@v2.22.2
          go mod download github.com/wadey/gocovmerge

          # Vendor the dependencies
          go mod vendor

      - name: Display Go version
        run: |
          echo "Go version: ${{ matrix.go-version }}"

      - name: Set up Aerospike Database
        uses: aerospike/shared-workflows/.github/actions/setup-aerospike-server@7f6d2f3b9c1a8e4d0b5c6a2f8e3d1b9c7a4f2e6d # pinned SHA
        with:
          aerospike-version: ${{ matrix.version }}
          num-nodes: 1
          enable-strong-consistency: ${{ matrix.mode == 'SC' }}
          features-content: ${{ secrets.FEATURES_CONF }}
          oidc-provider: ${{ vars.OIDC_PROVIDER }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE }}

      - name: Test Lua Code
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: go run -mod=vendor github.com/onsi/ginkgo/v2/ginkgo -cover -race -r -keep-going -succinct -randomize-suites internal/lua
      - name: Test types package
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: go run -mod=vendor github.com/onsi/ginkgo/v2/ginkgo -cover -race -r -keep-going -succinct -randomize-suites types
      - name: Test pkg tests
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: go run -mod=vendor github.com/onsi/ginkgo/v2/ginkgo -cover -race -r -keep-going -succinct -randomize-suites pkg
      - name: Run the tests
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: go run -mod=vendor github.com/onsi/ginkgo/v2/ginkgo -output-dir=./ -coverprofile=covprofile_native.out -covermode=atomic -coverpkg=./... -race -keep-going -succinct -randomize-suites -skip="HyperLogLog"
      - name: Combine Cover Profiles
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: go run -mod=vendor github.com/wadey/gocovmerge covprofile_*.out > cover_all.out
      - name: Check Code Coverage
        id: check-coverage
        uses: vladopajic/go-test-coverage@5f3508324fc185e82048a2861f8bdd3d83db133b # v2.18.9
        continue-on-error: true
        with:
          config: ./.testcoverage.yml
      - name: Show coverage report in step summary
        if: always()
        run: |
          {
            echo "**coverage:**"
            echo ""
            echo "**${{ matrix.version }}-${{ matrix.mode }}:** ${{ steps.check-coverage.outputs.total-coverage }}%"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: create and move cover file to reports directory
        run: |
          mkdir -p reports
          mv covprofile_*.out reports/

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cover_${{matrix.version}}_${{matrix.mode}}
          path: reports
          if-no-files-found: warn

  merged_coverage:
    name: Final Coverage
    needs: build
    uses: ./.github/workflows/merge-coverage.yml
    with:
      artifact_pattern: cover_*
      threshold: ${{ fromJSON(vars.COVERAGE_THRESHOLD) }}
    permissions:
      actions: write
      contents: read
