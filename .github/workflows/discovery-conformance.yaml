name: Discovery conformance

# L0: discovery unit tests. L1: shared fixture set through TestConformance.
# Neither job needs a live Aerospike cluster or repository secrets.

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - stage
  workflow_dispatch:

jobs:
  l0:
    name: L0 discovery unit tests
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run discovery unit tests
        env:
          AEROSPIKE_TEST_SKIP_SUITE_CLIENT: "1"
        run: |
          set -euo pipefail
          go test -count=1 -timeout 10m -race ./internal/discovery/...
          go test -count=1 -timeout 15m -race -run TestAerospike \
            -ginkgo.label-filter=discovery -ginkgo.fail-on-empty -ginkgo.succinct .

  l1:
    name: L1 conformance
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout conformance fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aerospike/aerospike-client-conformance
          ref: 1971a9b61975fbecac1c3b6d4c612eb7bc03d101 # main, fixture set 1.1.0
          path: conformance-fixtures

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run conformance fixtures
        env:
          AEROSPIKE_TEST_SKIP_SUITE_CLIENT: "1"
          CONFORMANCE_DIR: ${{ github.workspace }}/conformance-fixtures
          CONFORMANCE_REPORT: ${{ runner.temp }}/conformance-report/conformance-report.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${CONFORMANCE_REPORT}")"
          go test -count=1 -timeout 10m -run '^TestConformance$' .

      - name: Upload conformance report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-report-go
          path: ${{ runner.temp }}/conformance-report/conformance-report.json
          overwrite: true

      - name: Collect conformance report
        if: ${{ always() }}
        uses: aerospike/aerospike-client-conformance/.github/actions/collect-conformance-report@1971a9b61975fbecac1c3b6d4c612eb7bc03d101 # main
        with:
          reports-directory: ${{ runner.temp }}/conformance-report
          fixtures-directory: ${{ github.workspace }}/conformance-fixtures
          declarations-directory: ${{ github.workspace }}
