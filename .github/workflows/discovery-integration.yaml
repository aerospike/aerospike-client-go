name: Discovery integration

# TLS certificate matching is an EE job. It runs in the aerospike-client-conformance
# tls-matching test environment, one Enterprise server per certificate case.
# It runs on same-repo pull requests, on push and on workflow_dispatch. Fork pull requests do not receive FEATURES_CONF,
# so the gate job reports it as a skipped layer instead. The gate also
# reports L3 (kind plus operator, discovery-k8s.yaml).

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - stage
      - CLIENT-5732-dev-pluggable-discovery # TODO: remove post testing
  workflow_dispatch:

jobs:
  # The only place this workflow decides the enterprise gate, so a skip and its report cannot drift apart.
  gate:
    name: Skipped layers
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}
    outputs:
      enterprise: ${{ steps.gate.outputs.enterprise }}
    steps:
      - name: Decide the enterprise gate
        id: gate
        env:
          ENTERPRISE: >-
            ${{
              github.event_name == 'push'
              || github.event_name == 'workflow_dispatch'
              || github.event.pull_request.head.repo.full_name == github.repository
            }}
        run: |
          set -euo pipefail
          layers='[]'
          if [[ "${ENTERPRISE}" != true ]]; then
            layers=$(jq -cn '[{layer: "TLS certificate matching", tests: "certificate name matching against Enterprise servers", reason: "fork pull requests get no FEATURES_CONF"},{layer: "L3", tests: "kind plus operator shared-endpoint pass-through and scale", reason: "fork pull requests get no FEATURES_CONF"},{layer: "L3 TLS", tests: "kind plus operator tls-name", reason: "fork pull requests get no FEATURES_CONF"},{layer: "L3 networkLoadBalancer", tests: "kind plus operator networkLoadBalancer pass-through, pod reschedule, recreated Node and tls-name", reason: "fork pull requests get no FEATURES_CONF"}]')
          fi
          echo "enterprise=${ENTERPRISE}" >> "${GITHUB_OUTPUT}"
          echo "layers=${layers}" >> "${GITHUB_OUTPUT}"

      - name: Report skipped layers
        uses: aerospike/aerospike-client-conformance/.github/actions/report-skipped-layers@42db5e9c508226cc0ad1496d7dff1cb23dac2bb0 # main
        with:
          layers: ${{ steps.gate.outputs.layers }}

  tls-matching:
    name: TLS certificate matching
    needs: gate
    if: needs.gate.outputs.enterprise == 'true'
    uses: ./.github/workflows/tls-matching.yaml
    with:
      server-tag: 8.2.0.0
    secrets: inherit
