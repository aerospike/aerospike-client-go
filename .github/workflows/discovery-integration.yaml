name: Discovery integration

# Own workflow so the L2 runtime is not added to every build.yml matrix cell.
#
# CE (community, no feature key) runs on every pull request. EE (enterprise
# with TLS, rows such as N-6 and N-17) runs on same-repo pull requests, on
# push and on workflow_dispatch. Fork pull requests do not receive
# FEATURES_CONF, so the gate job reports EE as a skipped layer instead.
#
# TLS certificate matching is an EE job. It starts one Enterprise container
# per fixture certificate shape, so it uses the same FEATURES_CONF gate.

permissions:
  id-token: write
  contents: read

on:
  pull_request:
  push:
    branches:
      - stage
  workflow_dispatch:

jobs:
  # The only place the enterprise gate is decided, so a skip and its report cannot drift apart.
  gate:
    name: Skipped layers
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}
    outputs:
      enterprise: ${{ steps.gate.outputs.enterprise }}
    steps:
      - name: Decide the enterprise gate
        id: gate
        env:
          ENTERPRISE: >-
            ${{
              github.event_name == 'push'
              || github.event_name == 'workflow_dispatch'
              || github.event.pull_request.head.repo.full_name == github.repository
            }}
        run: |
          set -euo pipefail
          layers='[]'
          if [[ "${ENTERPRISE}" != true ]]; then
            layers=$(jq -cn '[{layer: "L2 EE", tests: "ee and ee cn-only profiles", reason: "fork pull requests get no FEATURES_CONF"},{layer: "TLS certificate matching", tests: "certificate name matching against Enterprise servers", reason: "fork pull requests get no FEATURES_CONF"}]')
          fi
          echo "enterprise=${ENTERPRISE}" >> "${GITHUB_OUTPUT}"
          echo "layers=${layers}" >> "${GITHUB_OUTPUT}"

      - name: Report skipped layers
        uses: aerospike/aerospike-client-conformance/.github/actions/report-skipped-layers@1971a9b61975fbecac1c3b6d4c612eb7bc03d101 # main
        with:
          layers: ${{ steps.gate.outputs.layers }}

  # A job if is evaluated before the matrix, so the fork gate cannot live on a
  # matrix cell. Community and enterprise stay two jobs.
  l2-ce:
    name: L2 discovery (ce${{ matrix.profile != 'default' && format(', {0}', matrix.profile) || '' }})
    strategy:
      fail-fast: false
      matrix:
        profile:
          - default
          - reachable
          - pass-through-names
          - pass-through-ports
          - port-map-range
          - low-mtu
          - port-range
          - idle-reset
    uses: ./.github/workflows/discovery-l2.yaml
    with:
      subset: ce
      server-container-repo: database-docker-virtual/aerospike-server
      server-tag: latest
      profile: ${{ matrix.profile }}
    secrets: inherit

  l2-ee:
    name: L2 discovery (ee${{ matrix.profile != 'default' && format(', {0}', matrix.profile) || '' }})
    needs: gate
    if: needs.gate.outputs.enterprise == 'true'
    strategy:
      fail-fast: false
      matrix:
        profile:
          - default
          - cn-only
    uses: ./.github/workflows/discovery-l2.yaml
    with:
      subset: ee
      server-container-repo: database-docker-dev-local/aerospike-server-enterprise
      server-tag: 8.2.0.0
      tls-listen-port-base: "43331"
      profile: ${{ matrix.profile }}
    secrets: inherit

  tls-matching:
    name: TLS certificate matching
    needs: gate
    if: needs.gate.outputs.enterprise == 'true'
    uses: ./.github/workflows/tls-matching.yaml
    with:
      server-container-repo: database-docker-dev-local/aerospike-server-enterprise
      server-tag: 8.2.0.0
    secrets: inherit
