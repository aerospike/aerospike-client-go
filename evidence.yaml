summary: |
  Ported the Java client's "Extended errors" feature (CLIENT-4221) to the Go
  client (sync path only). Added the SubCode catalog, ErrorDetailVerbosity on
  BasePolicy/WritePolicy with dynamic-config plumbing, wire-level emission of
  the info4 verbosity bits across writeHeaderWrite / writeHeaderReadWrite /
  writeHeaderRead / writeHeaderReadHeader, msgpack-detail parsing in
  recordParser, and surfacing of the parsed subcode + formatted message on
  AerospikeError via a new newServerError helper. Updated all sync write/read
  command parseResult paths (delete/write/touch/exists/read/read_header/
  execute/operate_write) to route their errors through that helper.
  Ported the Java unit-style parser tests as ginkgo specs (24 passing on the
  local 8.1.2 server) and the integration suite (20 specs, skipped here
  because the local server is 8.1.2 < 8.1.3 as the gate requires).
